name: Dognosis
description: >-
  Dognosis is a Bengaluru, India deeptech company building olfaction AI that pairs trained
  detection dogs with machine learning to find disease from a single breath sample. Its product,
  BreathEasy, is a non-invasive breath test that produces a VOC-based cancer risk score for
  clinicians; a Phase 2 study published in the Journal of Clinical Oncology reported over 90%
  accuracy across seven cancer types, including at early and treatable stages. Dognosis is a
  portfolio company of Prosus Ventures. No public developer API is published today; this API
  Evangelist profile tracks the company's digital, discovery, and security surface (an llms.txt
  is served; no /.well-known discovery documents are published).
